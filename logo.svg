<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="aquiloBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144F9B" />
      <stop offset="100%" stop-color="#0A3368" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="220" rx="16" fill="url(#aquiloBg)" />

  <!-- Microchip / CPU Icon -->
  <g transform="translate(160, 68)">
    <!-- Central rounded chip frame -->
    <rect x="-22" y="-22" width="44" height="44" rx="10" fill="none" stroke="#FFFFFF" stroke-width="7" />

    <!-- Top pins (2 vertical pins) -->
    <rect x="-13" y="-38" width="7" height="10" rx="2.5" fill="#FFFFFF" />
    <rect x="6" y="-38" width="7" height="10" rx="2.5" fill="#FFFFFF" />

    <!-- Bottom pins (2 vertical pins) -->
    <rect x="-13" y="28" width="7" height="10" rx="2.5" fill="#FFFFFF" />
    <rect x="6" y="28" width="7" height="10" rx="2.5" fill="#FFFFFF" />

    <!-- Left pins (2 horizontal pins) -->
    <rect x="-38" y="-13" width="10" height="7" rx="2.5" fill="#FFFFFF" />
    <rect x="-38" y="6" width="10" height="7" rx="2.5" fill="#FFFFFF" />

    <!-- Right pins (2 horizontal pins) -->
    <rect x="28" y="-13" width="10" height="7" rx="2.5" fill="#FFFFFF" />
    <rect x="28" y="6" width="10" height="7" rx="2.5" fill="#FFFFFF" />
  </g>

  <!-- Aquilo Text -->
  <text
    x="160"
    y="175"
    fill="#FFFFFF"
    font-size="58"
    font-weight="700"
    font-family="'Consolas', 'Roboto Mono', 'Ubuntu Mono', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
    letter-spacing="5"
    text-anchor="middle"
  >
    Aquilo
  </text>
</svg>
